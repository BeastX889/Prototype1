name: Android release bundle

# Builds the Play Store .aab on GitHub's runners (which ship the Android SDK).
# The repo is public, so the upload key is never committed. If the repo secrets
# ANDROID_UPLOAD_KEYSTORE_BASE64 and ANDROID_UPLOAD_KEYSTORE_PASSWORD are set,
# the bundle is signed with that key and is ready to upload to Google Play.
# Without them it is signed with the throwaway debug key and must be re-signed
# before uploading.

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Android versionCode — must be higher than every previous Play upload'
        required: true
        default: '1'

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Set versionCode
        env:
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          node -e "
            const fs = require('fs');
            const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            const vc = Number(process.env.VERSION_CODE);
            if (!Number.isInteger(vc) || vc < 1) throw new Error('version_code must be a positive integer');
            app.expo.android.versionCode = vc;
            fs.writeFileSync('app.json', JSON.stringify(app, null, 2));
            console.log('versionCode =', vc, 'versionName =', app.expo.version);
          "

      - name: Generate native Android project
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: npx expo prebuild --platform android --no-install

      - name: Show effective permissions
        run: grep -E 'uses-permission' android/app/src/main/AndroidManifest.xml

      - name: Prepare upload key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No upload-key secrets set — bundle is debug-signed and must be re-signed before uploading to Google Play."
          fi

      - name: Build release bundle
        working-directory: android
        env:
          SIGNED: ${{ steps.key.outputs.signed }}
          KS_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          if [ "$SIGNED" = "true" ]; then
            ./gradlew :app:bundleRelease --no-daemon \
              -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.jks" \
              -Pandroid.injected.signing.store.password="$KS_PASSWORD" \
              -Pandroid.injected.signing.key.alias=upload \
              -Pandroid.injected.signing.key.password="$KS_PASSWORD"
          else
            ./gradlew :app:bundleRelease --no-daemon
          fi

      - name: Show signing certificate
        run: keytool -printcert -jarfile android/app/build/outputs/bundle/release/app-release.aab | grep -E "Owner|SHA256:" | head -2

      - name: Remove upload key from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7
          if-no-files-found: error
